# distros/<did>.conf —— 一个系统版本一份，文件名即 DID
#
# 这是 shell 片段，由构建脚本 source，因此可以写条件判断。
# 字段完整契约见 docs/distro-conf.md，这里是带注释的起始骨架。

DID=<did>                                  # 与文件名一致，同时是产物文件名前缀
DISPLAY_NAME="<中文显示名>"                # 写进镜像的 image.title label
IMAGE=<镜像名>-<did>                       # 必须按版本唯一，共用会让不同版本互相覆盖
FAMILY=deb                                 # deb 或 rpm，决定校验层用哪套判据
METHOD=mmdebstrap                          # mmdebstrap / selfhost / slice / rpmmedia

# ── 在线源三要素 ────────────────────────────────────────
# suite 名先把 dists/<suite>/Release 拉下来读 Label 与 Suite 字段再定。
# 踩过的坑：给已装机器推更新的差异源包很多却没有 libc6；
# debootstrap 会核对请求的 suite 名与 Release 自述是否一致，而 apt 不核对。
MIRROR=http://<归档站>/
SUITE=<suite>
COMPONENTS="main universe"                 # glibc 可能在 universe 而非 main，别只配 main

USRMERGE=<yes|no>
ADMINDIR=<dpkg admindir，通常留默认>

# ── 验收基线 ────────────────────────────────────────────
# 不要留空：留空会因「期望空 == 实际空」被判通过，等于这项验收不存在。
# 值从跑起来的镜像里实测，不要取源索引里的元包版本。
EXPECT_GLIBC=<x.yy>
EXPECT_LIBSTDCPP=<6.0.zz>
EXPECT_GLIBCXX=<3.4.zz>

# 同一大版本的不同架构常常是独立产品线，基线不同就必须覆写，
# 否则门禁会拿错误的基线判 PASS。ARCH 在 source 本文件之前已设好。
case "$ARCH" in
  loong64|loongarch64)
    # EXPECT_GLIBC=<...>
    # EXPECT_LIBSTDCPP=<...>
    # EXPECT_GLIBCXX=<...>
    ;;
esac

# ── 厂商坏包与内核态组件 ────────────────────────────────
# 每一条都写清楚绕的是哪个具体缺陷，否则以后没人敢删。
REPACK_DEBS=""                             # 需要重打包的坏包，路径里可用 ${ARCH}
STUB_PROVIDES=""                           # 由假包顶替的依赖（内核态组件一律走这里）
PIN_NEVER=""                               # 永不安装的包

# ── 三个档位的包列表 ────────────────────────────────────
# devel 实际装的是 BASE_INCLUDE 加 DEVEL_INCLUDE，不要在 DEVEL 里重复 BASE。
MICRO_INCLUDE="ca-certificates,tzdata,locales,libstdc++6"
BASE_INCLUDE=""
DEVEL_INCLUDE="build-essential,pkg-config,dpkg-dev"

EXPECT_SHADOW=<uid:gid/mode>               # /etc/shadow 的期望属主与权限

# ── 期望失败 ────────────────────────────────────────────
# 判据只有一条：这个现象在真机上也一样吗。一样就进 XFAIL，不一样就是真缺陷。
# 每条都要注明为什么它在真机上也这样。居然通过了会报 xpass，提醒收回豁免。
XFAIL=""

name: 阶段三 · 发布一个档位的跨架构镜像

# 在测试全绿之后才发布：把同一档位各架构的镜像制品装载、打 tag 推到 GHCR，
# 再合并成一个 manifest list。一个 job 负责一个（版本 × 档位），
# 内部处理该档位的全部架构。
#
# 每档同时打两个 tag：滚动的给人用，带日期的不可变，供 CI 钉死。
# 滚动 tag 会随重建而变，而这批镜像的价值在于 ABI 保真——用户必须能钉死一版。
on:
  workflow_call:
    inputs:
      distro-id:  { type: string, required: true }
      tier:       { type: string, required: true }
      image:      { type: string, required: true, description: "GHCR 仓库名，如 kylin" }
      tag-prefix: { type: string, required: true, description: "版本前缀，如 v11" }
      arches:     { type: string, required: true, description: "空格分隔" }
      latest:     { type: boolean, default: false, description: "该档位是否同时打成 latest" }
      alias-prefixes: { type: string, default: "", description: "空格分隔的别名前缀：为本次推出的每个 tag 以同 digest 再建一份 <别名前缀> 版本（如 v6 之于 v6.0.100）。别名是同一镜像的另一个名字，不是再发一遍" }

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      # 需要 checkout 才能取 commit 日期与 submodule 的 SHA
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/download-artifact@v4
        with:
          pattern: img-${{ inputs.distro-id }}-*-${{ inputs.tier }}
          path: imgs

      # 实测的 ABI 值来自测试阶段，不在这里重新跑容器——跨架构时跑起来还要再装
      # 一次 QEMU，而那个值测试阶段已经量过并写进了结果 JSON。
      - uses: actions/download-artifact@v4
        with:
          pattern: result-${{ inputs.distro-id }}-*-${{ inputs.tier }}
          path: results
          merge-multiple: true

      - name: 定日期与溯源信息
        id: meta
        run: |
          set -eu
          # 日期取 kylin HEAD 的 committer date（UTC），不是构建时刻。
          # 这样同一个 commit 无论何时重建都得同一个 tag。
          #
          # 但要清楚它锁不住什么：镜像内容还取决于上游源的包。同一 commit 隔一周
          # 重建，若源更新过则产出字节不同，而 tag 相同——这是唯一的失真窗口。
          # 镜像里没有记录源快照的 label（那个值只存在于构建机上，发布 job 取不到），
          # 所以要确认手里两个镜像是不是同一份，只能比 digest。
          STAMP=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "$GITHUB_SHA")
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "kylin_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "buildkit_sha=$(git -C buildkit rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "  commit 日期 STAMP=$STAMP"
          echo "  kylin=$GITHUB_SHA"
          echo "  buildkit=$(git -C buildkit rev-parse HEAD)"

      - name: 装载各架构镜像
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd jq
          found=0
          for d in imgs/*/; do
            [ -f "$d/image.tar.zst" ] || continue
            zstd -d -c "$d/image.tar.zst" | docker load
            found=$((found+1))
          done
          # 一个都没装上必须失败：后面的 docker tag 会报「镜像不存在」，
          # 那个报错指向 tag 而不是指向「制品没下来」，离真因很远。
          [ "$found" -gt 0 ] || { echo "::error::没有装载到任何镜像制品"; exit 1; }
          echo "装载了 $found 个镜像制品"
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | sed 's/^/  /'

      - name: 校验各架构制品互不相同
        env: { TIER: "${{ inputs.tier }}" }
        run: |
          set -eu
          # 这道门禁是为一次真实事故加的：各架构制品曾共用同一个本地 repo:tag，
          # docker load 让后装的把 tag 从先装的身上摘走，于是同一份 rootfs 被推成
          # 三个架构 tag（六次 push 引用同一层），manifest list 照样建得出来、CI 全绿。
          # 判据取层摘要：架构不同的 rootfs 不可能同层。
          declare -A seen=()
          for a in ${{ inputs.arches }}; do
            REF=$(cat "imgs/img-${{ inputs.distro-id }}-$a-$TIER/image-ref.txt" 2>/dev/null || true)
            [ -n "$REF" ] || { echo "  跳过 $a：没有该架构的制品"; continue; }
            docker image inspect "$REF" >/dev/null 2>&1 || { echo "::error::$REF 未装载"; exit 1; }
            P=$(docker image inspect "$REF" --format '{{.Os}}/{{.Architecture}}')
            L=$(docker image inspect "$REF" --format '{{json .RootFS.Layers}}' | sha256sum | cut -c1-16)
            echo "  $a  $REF  平台 $P  层指纹 $L"
            [ "$P" = "linux/$a" ] || { echo "::error::$REF 的平台戳是 $P，期望 linux/$a"; exit 1; }
            [ -z "${seen[$L]:-}" ] || { echo "::error::$REF 与 ${seen[$L]} 的层完全相同，本地 tag 撞车了"; exit 1; }
            seen[$L]=$REF
          done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 覆盖检查
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          PFX: ${{ inputs.tag-prefix }}
          TIER: ${{ inputs.tier }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          set -eu
          # 日期 tag 是「约定不动」而非强制——GHCR 的 tag 本来就可变。
          # 一天内多次发布会覆盖它，这是允许的，但必须留痕：
          # 否则某天有人发现自己钉的 tag 变了，却查不到何时被什么覆盖。
          T="$REG:$PFX-$TIER-$STAMP"
          if OLD=$(docker manifest inspect "$T" 2>/dev/null | sha256sum | cut -c1-16); then
            echo "::warning::$T 已存在，本次发布将覆盖它（同一天内重复发布）"
            echo "  旧 manifest 摘要（前16位）: $OLD"
            echo "  若需保留旧版，请先用 digest 记下它：docker buildx imagetools inspect $T"
          else
            echo "  $T 尚不存在，本次为首发"
          fi

      - name: 打 label、推送各架构 tag
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          PFX: ${{ inputs.tag-prefix }}
          TIER: ${{ inputs.tier }}
          STAMP: ${{ steps.meta.outputs.stamp }}
          KSHA: ${{ steps.meta.outputs.kylin_sha }}
          BSHA: ${{ steps.meta.outputs.buildkit_sha }}
          RUNURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          pushed=""
          for a in ${{ inputs.arches }}; do
            SRC=$(cat "imgs/img-${{ inputs.distro-id }}-$a-$TIER/image-ref.txt" 2>/dev/null || true)
            [ -n "$SRC" ] || { echo "跳过 $a：没有该架构的制品"; continue; }
            docker image inspect "$SRC" >/dev/null 2>&1 || { echo "跳过 $a：镜像 $SRC 未装载"; continue; }

            # 实测 ABI 值取自测试阶段的结果 JSON。路径用 find 定位而不是拼：
            # 制品内部本身带一层 results/，配上 download-artifact 的
            # merge-multiple 落地成 results/results/<file>.json，写死路径读不到，
            # 于是三个 ABI label 一直是空字符串——警告当时就打在日志里了，没人读。
            RJ=$(find results -type f -name "${{ inputs.distro-id }}-$a-$TIER.json" 2>/dev/null | head -1)
            [ -n "$RJ" ] || { echo "::error::找不到 ${{ inputs.distro-id }}-$a-$TIER.json，实测 ABI 值无从取得"; exit 1; }
            MG=$(jq -r '.measured.glibc // ""' "$RJ")
            ML=$(jq -r '.measured.libstdcpp // ""' "$RJ")
            MX=$(jq -r '.measured.glibcxx // ""' "$RJ")
            # 溯源锚点按构建路径不同：在线源那几条靠 suite 定位快照，切片路径没有 suite
            # （它从 ISO 抽 squashfs），锚点是 ISO 与 squashfs 指纹。写死 cn.internal.suite
            # 会在切片路径上留一个空值 label——空值比缺失更糟，空值门禁因此把统信那批
            # 发布整个拦下了。改为按 conf 里实际有什么就记什么，一个都没有才失败。
            # 取值必须带 ARCH：ISO_URL 与 SQUASHFS_SHA256 都是按架构分支的，
            # 不传就会拿到 runner 自身架构那一支，给 arm64 的镜像贴上 amd64 的锚点。
            PROV=()
            SUITE=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' SUITE)
            if [ -n "$SUITE" ]; then PROV+=(-c "LABEL cn.internal.suite=\"$SUITE\""); fi
            IURL=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' ISO_URL)
            if [ -n "$IURL" ]; then PROV+=(-c "LABEL cn.internal.iso-url=\"$IURL\""); fi
            SQSHA=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' SQUASHFS_SHA256)
            # 值一律用引号包住。REPO_BASES 是空格分隔的多个源地址，而
            # `docker commit -c "LABEL k=v1 v2"` 会把 v2 当成第二个赋值，报
            #   Syntax error - can't find = in "http://..." Must be of the form: name=value
            # 其余几项当前不含空格，但一并加引号，免得以后某个 conf 一改就炸。
            # rpm 源那条路径（METHOD=rpmrepo）既没有 suite 也没有 ISO，它的溯源锚点是
            # 源地址本身加公钥指纹。不登记的话这道门禁会把整批发布拦下来 —— 实测第一次
            # 发布麒麟信安时六个 publish job 全部因此失败。
            RB=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' REPO_BASES)
            if [ -n "$RB" ]; then PROV+=(-c "LABEL cn.internal.repo-bases=\"$RB\""); fi
            KFP=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' RPM_KEY_FP)
            if [ -n "$KFP" ]; then PROV+=(-c "LABEL cn.internal.rpm-key-fp=\"$KFP\""); fi
            if [ -n "$SQSHA" ]; then PROV+=(-c "LABEL cn.internal.squashfs-sha256=\"$SQSHA\""); fi
            # 数据镜像路径：材料经本机中转，锚点是数据镜像 tag 加 manifest 指纹，
            # 由它再链回 .origin 里的厂商锚点（ISO 官方校验和 / 源 Release 指纹）。
            SDI=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' SRCDATA_IMAGE)
            if [ -n "$SDI" ]; then PROV+=(-c "LABEL cn.internal.srcdata-image=\"$SDI\""); fi
            SDM=$(ARCH="$a" buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' SRCDATA_MANIFEST_SHA256)
            if [ -n "$SDM" ]; then PROV+=(-c "LABEL cn.internal.srcdata-manifest-sha256=\"$SDM\""); fi
            [ ${#PROV[@]} -gt 0 ] || { echo "::error::conf 里既无 suite、也无 ISO、也无 REPO_BASES、也无 SRCDATA_IMAGE，记不下溯源锚点"; exit 1; }

            # 溯源信息在这里打而不是 import 时，是因为 commit SHA 与 run URL 只有发布
            # 阶段才知道，而两条构建路径的 import 分处两个脚本——写在那儿会变成
            # 一处对一处错。
            #
            # 不能用 docker build 打：BuildKit 解析 FROM 时要求目标平台与本地镜像
            # 一致，而这个 job 在 amd64 上还要给 arm64/loong64 的镜像打 label，
            # 于是它绕开本地镜像去拉 docker.io/library/kylin-v4:base，报
            # pull access denied——看起来像"依赖了 Docker Hub 上的同名镜像"。
            # docker commit 走守护进程、不经 BuildKit，跨架构可用，且复用原层不新增层。
            #
            # 两处要小心：docker create 不能带命令（commit 会把它写成新的 CMD），
            # 且 commit 记录的是**容器**配置——docker CLI 会把 config.json 里的
            # proxies 注入成容器环境变量、一并烧进镜像。runner 上没有那份配置，
            # 但不能靠"没有"来保证，所以打完逐项比对配置与层。
            CID=$(docker create "$SRC")
            docker commit \
              -c "LABEL org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              -c "LABEL org.opencontainers.image.revision=$KSHA" \
              -c "LABEL org.opencontainers.image.version=$PFX-$TIER-$STAMP" \
              -c "LABEL cn.internal.repo-commit=$KSHA" \
              -c "LABEL cn.internal.buildkit-commit=$BSHA" \
              "${PROV[@]}" \
              -c "LABEL cn.internal.arch=$a" \
              -c "LABEL cn.internal.glibc=$MG" \
              -c "LABEL cn.internal.libstdcpp=$ML" \
              -c "LABEL cn.internal.glibcxx=$MX" \
              -c "LABEL cn.internal.build-run=$RUNURL" \
              "$CID" "$SRC-labeled" >/dev/null
            docker rm -f "$CID" >/dev/null

            # 门禁：显式列出「必须不变」的语义字段，逐项比对。
            # 不能写成「除 Labels 外全等」——docker commit 记录的是容器，
            # Hostname（容器 ID）、Image（父镜像引用）、AttachStdout/Stderr
            # 这些运行时记账字段本来就会变，与镜像语义无关。实测踩过：本机
            # docker 29.7 不动它们，runner 上会动，九个 job 全卡在这。
            # Env 排序后比对——只关心集合有没有被增删，不关心顺序。
            cfg(){ docker image inspect "$1" --format '{{json .}}' | jq -S '{
                     env:        ((.Config.Env//[])|sort),
                     cmd:        .Config.Cmd,
                     entrypoint: .Config.Entrypoint,
                     user:       .Config.User,
                     workdir:    .Config.WorkingDir,
                     stopsignal: .Config.StopSignal,
                     argsescaped:.Config.ArgsEscaped,
                     volumes:    .Config.Volumes,
                     ports:      .Config.ExposedPorts,
                     layers:     .RootFS.Layers,
                     os:         .Os,
                     arch:       .Architecture }'; }
            if ! diff <(cfg "$SRC") <(cfg "$SRC-labeled"); then
              echo "::error::打 label 时改动了 Labels 以外的东西（上面是差异）"; exit 1
            fi
            # 空值 label 比没有 label 更糟：它看起来像「量过了，值就是空」。
            # 上一轮四个 label 全空发了出去，就是因为没人对着值看一眼。
            EMPTY=$(docker image inspect "$SRC-labeled" \
                    --format '{{range $k,$v := .Config.Labels}}{{if eq $v ""}}{{$k}} {{end}}{{end}}')
            [ -z "$EMPTY" ] || { echo "::error::这些 label 的值是空的: $EMPTY"; exit 1; }
            echo "── $a 的溯源 label ──"
            docker inspect "$SRC-labeled" --format '{{json .Config.Labels}}' | tr ',' '\n' | sed 's/^/    /'

            for T in "$PFX-$TIER-$a" "$PFX-$TIER-$a-$STAMP"; do
              docker tag "$SRC-labeled" "$REG:$T"
              docker push "$REG:$T"
            done
            pushed="$pushed $REG:$PFX-$TIER-$a"
          done
          [ -n "$pushed" ] || { echo "::error::一个架构都没推成功"; exit 1; }
          printf '%s' "$pushed" > /tmp/pushed.txt

      - name: 合并 manifest list 并打印 digest
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          PFX: ${{ inputs.tag-prefix }}
          TIER: ${{ inputs.tier }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          set -eu
          SRCS=$(cat /tmp/pushed.txt)
          # manifest list 的隐含契约是各架构变体互为等价物。国产系统的 LoongArch
          # 移植常常是独立产品线（glibc 可能落后一个大版本），那种情况下同一个 tag
          # 在不同架构下的 ABI 并不一致——不是错误，但必须在仓库说明里写清楚，
          # 否则用户会把 amd64 上验过的结论套到别的架构上。镜像 label 里记了实测值。
          mk() {
            docker manifest create "$1" $SRCS
            docker manifest push "$1"
            echo "  ✔ $1"
          }
          mk "$REG:$PFX-$TIER"
          mk "$REG:$PFX-$TIER-$STAMP"
          # 不带档位后缀的 tag 指向 devel，与 golang:1.21 是完整版的惯例一致
          [ "$TIER" = devel ] && mk "$REG:$PFX"
          [ "${{ inputs.latest }}" = true ] && mk "$REG:latest"

          # 别名前缀：同 digest 再挂一个名字（imagetools create 引用既有 manifest，
          # 不重推层）。此前 v6 与 v6.0.100 是两条 publish 各做各的，溯源 label 里的
          # version 不同导致 digest 不同——「本质上同一镜像」必须落在 digest 相等上，
          # 挂完逐个断言。
          for AP in ${{ inputs.alias-prefixes }}; do
            for suf in "-$TIER" "-$TIER-$STAMP"; do
              docker buildx imagetools create -t "$REG:$AP$suf" "$REG:$PFX$suf"
              A=$(docker buildx imagetools inspect "$REG:$AP$suf" --format '{{.Manifest.Digest}}')
              B=$(docker buildx imagetools inspect "$REG:$PFX$suf" --format '{{.Manifest.Digest}}')
              [ "$A" = "$B" ] || { echo "::error::别名 $AP$suf 与 $PFX$suf 的 digest 不一致"; exit 1; }
              echo "  ✔ 别名 $REG:$AP$suf（digest 同 $PFX$suf）"
            done
            # 每架构 tag 同样建别名
            for r in $SRCS; do
              base=${r##*:}
              docker buildx imagetools create -t "$REG:$AP${base#$PFX}" "$r"
              docker buildx imagetools create -t "$REG:$AP${base#$PFX}-$STAMP" "$REG:$base-$STAMP"
            done
            if [ "$TIER" = devel ]; then
              docker buildx imagetools create -t "$REG:$AP" "$REG:$PFX"
              A=$(docker buildx imagetools inspect "$REG:$AP" --format '{{.Manifest.Digest}}')
              B=$(docker buildx imagetools inspect "$REG:$PFX" --format '{{.Manifest.Digest}}')
              [ "$A" = "$B" ] || { echo "::error::裸别名 $AP 与 $PFX digest 不一致"; exit 1; }
              echo "  ✔ 别名 $REG:$AP"
            fi
          done

          echo "── 校验 manifest list 的平台与成员 ──"
          # 各架构指向同一份 rootfs 时，manifest list 照样建得出来、CI 照样全绿。
          # 只有把平台集合和成员 digest 摊开对一遍才看得见——这次就是这么漏出去的。
          RAW=$(docker buildx imagetools inspect "$REG:$PFX-$TIER" --raw)
          want=$(for r in $SRCS; do docker image inspect "$r" --format 'linux/{{.Architecture}}'; done | sort | tr '\n' ' ')
          got=$(printf '%s' "$RAW" | jq -r '.manifests[]|"\(.platform.os)/\(.platform.architecture)"' | sort | tr '\n' ' ')
          echo "  期望平台: $want"
          echo "  实际平台: $got"
          [ "$want" = "$got" ] || { echo "::error::manifest list 的平台集合与推上去的镜像不符"; exit 1; }
          nm=$(printf '%s' "$RAW" | jq -r '.manifests|length')
          nd=$(printf '%s' "$RAW" | jq -r '.manifests[].digest' | sort -u | wc -l)
          [ "$nm" = "$nd" ] || { echo "::error::manifest list 有 $nm 个成员却只有 $nd 个不同 digest，各架构指向了同一份镜像"; exit 1; }
          echo "  $nm 个成员、$nd 个不同 digest"

          echo "── 本次发布的 digest（真正的不可变引用）──"
          for T in "$PFX-$TIER" "$PFX-$TIER-$STAMP"; do
            D=$(docker buildx imagetools inspect "$REG:$T" --format '{{.Manifest.Digest}}' 2>/dev/null || echo "取不到")
            echo "  $REG:$T"
            echo "    → $REG@$D"
          done
          echo "  日期 tag 是便利；要钉死请用 @sha256 形式。"

name: 探测 Actions 首推包的可见性继承

# 回答一个问题：workflow 用 GITHUB_TOKEN 首推的 GHCR 包，可见性是否继承仓库
# （public 仓库 → public 包）。REST/GraphQL 都改不了已有包的可见性，若继承
# 成立，把数据镜像改为「本机传 asset → workflow 转推」就能全自动拿到 public。
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: 推一个极小包并读回可见性
        run: |
          set -eu
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo probe > f
          tar -cf - f | docker import - ghcr.io/${{ github.repository_owner }}/vistest:t1 >/dev/null
          docker push -q ghcr.io/${{ github.repository_owner }}/vistest:t1 >/dev/null
          V=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/vistest" | jq -r .visibility)
          echo "首推可见性: $V"
          C=$(curl -s -o /dev/null -w '%{http_code}' "https://ghcr.io/v2/${{ github.repository_owner }}/vistest/tags/list")
          echo "匿名访问: HTTP $C"

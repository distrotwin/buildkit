name: 构建并发布（deb 系）

# 可复用 workflow：下游 OS 仓库以 `uses:` 调用。
# 一个 job 对应一个（版本 × 架构），内部顺序产出三档——三档共用同一个 stage，
# 拆成「版本 × 架构 × 档位」会把 stage 重复构建三遍。
on:
  workflow_call:
    inputs:
      distro-id:    { type: string, required: true,  description: "distros/<id>.conf 的 id" }
      arch:         { type: string, required: true,  description: "dpkg 架构名，如 amd64 / arm64 / loong64" }
      runner:       { type: string, required: true,  description: "runs-on 标签" }
      image:        { type: string, required: true,  description: "镜像名，不含 registry 与 tag" }
      tag-prefix:   { type: string, required: true,  description: "tag 前缀，如 v11" }
      tiers:        { type: string, default: "micro base devel" }
      needs-qemu:   { type: boolean, default: false, description: "非原生架构置 true" }
      push:         { type: boolean, default: true }

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # buildkit 是 submodule，不递归会拿到空目录

      # submodule 钉的是脚本版本，uses: 钉的是本 workflow 的版本，两个 pin 各自独立。
      # 不绑死的话会出现「用新 workflow 跑旧脚本」这种谁都没察觉的组合。
      #
      # 不用 github.job_workflow_sha：实测它在这里是空串。拿未经校验的值去比较，
      # 正是这道门禁本身要防的错——方向反过来写就会变成永真。改从调用方自己的
      # workflow 文件里取，自包含且可验证，并且先断言两边都非空再比。
      - name: 核对 submodule 与 workflow 同版本
        run: |
          set -eu
          have=$(git -C buildkit rev-parse HEAD)
          want=$(grep -rhoE 'buildkit/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}' .github/workflows/ \
                 | grep -oE '[0-9a-f]{40}$' | sort -u)
          n=$(printf '%s\n' "$want" | grep -c . || true)
          [ -n "$have" ] || { echo "::error::取不到 submodule 的 commit"; exit 1; }
          [ "$n" = "1" ] || {
            echo "::error::调用方的 uses: 指向了 $n 个不同的 buildkit commit，无法判定应当用哪个"
            printf '%s\n' "$want"; exit 1; }
          echo "submodule=$have"
          echo "workflow =$want"
          [ "$have" = "$want" ] || {
            echo "::error::buildkit submodule 与所调用 workflow 不是同一个 commit。"
            echo "::error::请把 submodule 更新到 $want，或把 uses: 指向 $have。"
            exit 1; }

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debootstrap dpkg-dev gpgv xz-utils zstd file

      # 只有非原生架构才需要。用宿主的 qemu-user-static，不要引入 tonistiigi/binfmt——
      # 实测它会破坏本来可用的 binfmt 注册。
      - name: 安装 QEMU 用户态模拟
        if: inputs.needs-qemu
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          echo "── 已注册的 binfmt 条目 ──"
          ls /proc/sys/fs/binfmt_misc/ | head -40

      # selfhost 路径在一个 debian:13 容器里跑 debootstrap 第一阶段（宿主 dpkg 版本
      # 太新，写出的 status 目标系统读不了）。同一个镜像也用来编门禁二进制。
      - name: 起 builder 容器
        run: |
          set -eu
          docker build -q --build-arg http_proxy= --build-arg https_proxy= \
            -f buildkit/Dockerfile.builder -t dosbuild-cache:latest buildkit/
          docker run -d --name dosb --privileged --init \
            -v "${{ github.workspace }}:/w" \
            -e DEBIAN_FRONTEND=noninteractive -e http_proxy= -e https_proxy= \
            dosbuild-cache:latest sleep infinity
          docker exec dosb bash -c 'ls -d /w/distros /w/buildkit/lib' # 挂载布局自检

      # 门禁二进制是架构相关的，必须在目标架构上现编，不能提交进仓库。
      # 缺了它们 verify.sh 会把对应 ABI 判定记为失败而不是跳过——这是有意的。
      - name: 编门禁二进制
        env:
          ARCH: ${{ inputs.arch }}
        run: sudo -E ARCH="$ARCH" buildkit/gate/build-gates.sh

      - name: 记录构建环境
        run: |
          echo "arch=${{ inputs.arch }}  runner=$(uname -m)  内核=$(uname -r)"
          echo "宿主 dpkg=$(dpkg --version | head -1)"
          echo "门禁二进制: $(ls -1 buildkit/gate/t_* 2>/dev/null | tr '\n' ' ')"
          cat buildkit/gate/.gate-status 2>/dev/null || echo "GATE_LOW_UNKNOWN=1"
          df -h / | tail -1

      # 只有声明了坏包重打包或容器假包的版本才需要本地源。没有这两项时
      # mk-localrepo 会因索引为空而失败，那是它的正确行为（空索引会让后面的 apt
      # 报「包被 pin 到 -1 又没人 Provides」，报错指不到根因），所以这里按 conf 判断。
      - name: 造本地源（仅需要的版本）
        env:
          ARCH: ${{ inputs.arch }}
          ROOT: ${{ github.workspace }}
        run: |
          set -eu
          . "./distros/${{ inputs.distro-id }}.conf"
          if [ -n "${REPACK_DEBS:-}" ] || [ -n "${STUB_PROVIDES:-}" ]; then
            sudo -E buildkit/tools/mk-localrepo.sh "${{ inputs.distro-id }}"
          else
            echo "${{ inputs.distro-id }} 无 REPACK_DEBS / STUB_PROVIDES，跳过本地源"
          fi

      - name: 构建三档
        env:
          ARCH: ${{ inputs.arch }}
          ROOT: ${{ github.workspace }}
        run: |
          sudo -E buildkit/build/build.sh "${{ inputs.distro-id }}" ${{ inputs.tiers }}

      - name: 导入并校验
        env:
          ARCH: ${{ inputs.arch }}
          ROOT: ${{ github.workspace }}
        run: |
          sudo -E buildkit/build/import.sh "${{ inputs.distro-id }}" ${{ inputs.tiers }}
          sudo -E buildkit/test/verify.sh  "${{ inputs.distro-id }}"

      # 校验通过才登录。顺序反过来的话，坏镜像也会先被推上去。
      - name: 登录 GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打 tag 并推送
        if: inputs.push
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          PFX: ${{ inputs.tag-prefix }}
          ARCH: ${{ inputs.arch }}
        run: |
          # 日期取 UTC，与构建用的 SOURCE_DATE_EPOCH 同源，便于对账
          STAMP=$(date -u +%Y%m%d)
          for tier in ${{ inputs.tiers }}; do
            SRC="${{ inputs.distro-id }}-$tier"
            # 每档两个 tag：滚动的给人用，带日期的给 CI 钉死
            docker tag "$SRC" "$REG:$PFX-$tier-$ARCH"
            docker tag "$SRC" "$REG:$PFX-$tier-$ARCH-$STAMP"
            docker push "$REG:$PFX-$tier-$ARCH"
            docker push "$REG:$PFX-$tier-$ARCH-$STAMP"
          done

      - name: 产物清单
        run: sudo -E buildkit/tools/gen-manifest.sh "${{ inputs.distro-id }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ inputs.distro-id }}-${{ inputs.arch }}
          path: out/*.manifest
          if-no-files-found: warn

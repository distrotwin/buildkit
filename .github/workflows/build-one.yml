name: 阶段二 · 构建单个镜像

# 一个 job 只建一个（版本 × 架构 × 档位），两条构建路径一视同仁。收益：
#   · mmdebstrap 路径三档完全独立，并行后墙钟从 45 分钟降到最慢那一档的 29 分钟
#   · 失败被隔离——devel 挂掉不再连带丢掉已经建好的 micro 与 base
# 产物用 docker save 走 artifact 传给测试阶段，不推临时 tag 污染 GHCR。
on:
  workflow_call:
    inputs:
      distro-id: { type: string, required: true }
      arch:      { type: string, required: true }
      tier:      { type: string, required: true }
      runner:    { type: string, required: true }
      needs-qemu: { type: boolean, default: false }
      # 单次尝试的上限与尝试次数。默认按原生构建给（实测最慢的档约 45 分钟），
      # 模拟构建要显著放宽：loong64 的 micro 档在 QEMU 下就要 322 秒，devel 带
      # build-essential 重得多。两者相乘还必须留在 GitHub 单 job 的 6 小时上限内，
      # 所以放宽超时的同时要减少尝试次数。
      timeout-minutes: { type: number, default: 60 }
      max-attempts:    { type: number, default: 3 }

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: 核对 submodule 与 workflow 同版本
        run: |
          set -eu
          have=$(git -C buildkit rev-parse HEAD)
          want=$(grep -rhoE 'buildkit/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}' .github/workflows/ \
                 | grep -oE '[0-9a-f]{40}$' | sort -u)
          n=$(printf '%s\n' "$want" | grep -c . || true)
          [ -n "$have" ] || { echo "::error::取不到 submodule 的 commit"; exit 1; }
          [ "$n" = "1" ] || { echo "::error::uses: 指向了 $n 个不同的 buildkit commit"; printf '%s\n' "$want"; exit 1; }
          [ "$have" = "$want" ] || { echo "::error::submodule($have) 与 workflow($want) 不是同一个 commit"; exit 1; }

      - name: 环境准备
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debootstrap dpkg-dev gpgv xz-utils zstd file
          if [ "${{ inputs.needs-qemu }}" = true ]; then
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support xz-utils binutils file
            echo "qemu-user-static: $(dpkg-query -W -f='${Version}' qemu-user-static)"
            echo "已注册的 binfmt 条目："; ls /proc/sys/fs/binfmt_misc/ | sed 's/^/  /'
            # 前置断言：目标架构的 binfmt 必须真的在。不断言的话，缺失会在
            # 三次 mmdebstrap 重试之后才以
            #   E: <arch> can neither be executed natively nor via qemu user emulation
            # 的形式出现——那句话不提 qemu 版本，而真因往往正是版本太旧：
            # LoongArch 用户态模拟是 QEMU 7.1 才加的，Ubuntu 22.04 只有 6.2。
            case "${{ inputs.arch }}" in
              loong64|loongarch64) NEED=qemu-loongarch64 ;;
              arm64)               NEED=qemu-aarch64 ;;
              armhf)               NEED=qemu-arm ;;
              mips64el)            NEED=qemu-mips64el ;;
              *)                   NEED="" ;;
            esac
            if [ -n "$NEED" ] && [ ! -e "/proc/sys/fs/binfmt_misc/$NEED" ]; then
              echo "::error::binfmt 缺少 $NEED，无法模拟 ${{ inputs.arch }}。"
              echo "::error::本机 qemu-user-static 为 $(dpkg-query -W -f='${Version}' qemu-user-static)；"
              echo "::error::LoongArch 需要 QEMU 7.1 以上，Ubuntu 22.04 只带 6.2，请改用更新的 runner。"
              exit 1
            fi

            # 旧世界 LoongArch 要求 QEMU ≥ 9（发行版自带的 8.2.2 会报 Unknown syscall 80），
            # 而 Ubuntu 24.04 没有够新的包。这一步按目标架构决定要不要换版，换的是钉住
            # 校验和的那一个 static-pie 二进制，并在换完后核对注册项真的指向它。
            buildkit/tools/ensure-qemu.sh "${{ inputs.arch }}"
          fi
          docker build --progress=plain --build-arg http_proxy= --build-arg https_proxy= \
            -f buildkit/Dockerfile.builder -t dosbuild-cache:latest buildkit/
          docker run -d --name dosb --privileged --init -v "$ROOT:/w" \
            -e DEBIAN_FRONTEND=noninteractive -e http_proxy= -e https_proxy= \
            dosbuild-cache:latest sleep infinity
          docker exec dosb bash -c 'ls -d /w/distros /w/buildkit/lib'

      # 把这一步的输入与环境原样打出来。出问题时最先要回答的是「当时是什么条件」，
      # 而那些条件散落在 matrix、conf、宿主三处，事后翻日志拼不齐。
      - name: 记录构建环境
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          echo "── 本 job 的输入 ──"
          echo "  distro-id=${{ inputs.distro-id }}  arch=${{ inputs.arch }}  tier=${{ inputs.tier }}"
          echo "  runner=${{ inputs.runner }}  needs-qemu=${{ inputs.needs-qemu }}"
          echo "── conf 解出的值（按本 job 的 ARCH）──"
          for k in METHOD MIRROR SUITE COMPONENTS IMAGE EXPECT_GLIBC EXPECT_LIBSTDCPP EXPECT_GLIBCXX XFAIL; do
            printf '  %-18s %s\n' "$k" "$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' "$k")"
          done
          echo "── 宿主 ──"
          echo "  uname=$(uname -m)  内核=$(uname -r)  发行版=$(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "  dpkg=$(dpkg --version | head -1)"
          echo "  mmdebstrap=$(mmdebstrap --version 2>&1 | head -1)"
          echo "  debootstrap=$(debootstrap --version 2>&1 | head -1)"
          echo "  docker=$(docker --version)"
          df -h / | tail -1 | sed 's/^/  磁盘 /'

      - name: 造本地源（仅需要的版本）
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          RD=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' REPACK_DEBS)
          SP=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' STUB_PROVIDES)
          if [ -n "$RD" ] || [ -n "$SP" ]; then
            sudo -E buildkit/tools/mk-localrepo.sh '${{ inputs.distro-id }}'
          else
            echo "${{ inputs.distro-id }} 无 REPACK_DEBS / STUB_PROVIDES，跳过本地源"
          fi

      # 重试交给 nick-fields/retry，脚本本身只管跑一次。
      # 源对境外出口偶发卡死（返回 200、Content-Length 正确、body 零字节；
      # debootstrap 侧表现为 "Couldn't download packages"），是外部条件不是逻辑问题。
      #
      # 执行位置按 METHOD 分派：mmdebstrap 系必须在 builder 容器（Debian 13）里跑——
      # 宿主 Ubuntu 的 apt 与 mmdebstrap 差了好几代，signed-by 行为不同。
      # selfhost 在宿主跑，它自己 docker exec 进容器完成阶段 1。
      - name: 构建 ${{ inputs.tier }}
        uses: nick-fields/retry@v4.0.0
        env:
          ARCH: ${{ inputs.arch }}
          ROOT: ${{ github.workspace }}
        with:
          timeout_minutes: ${{ inputs.timeout-minutes }}
          max_attempts: ${{ inputs.max-attempts }}
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -eu
            M=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' METHOD)
            echo "METHOD=$M  TIER=${{ inputs.tier }}"
            if [ "$M" = selfhost ]; then
              sudo -E DID='${{ inputs.distro-id }}' \
                buildkit/build/build-selfhost.sh '${{ inputs.tier }}'
            else
              docker exec -e http_proxy= -e https_proxy= dosb bash -c \
                "umask 022; ROOT=/w BK=/w/buildkit ARCH=$ARCH /w/buildkit/build/build.sh '${{ inputs.distro-id }}' '${{ inputs.tier }}'"
              sudo -E buildkit/build/import.sh '${{ inputs.distro-id }}' '${{ inputs.tier }}'
            fi

      - name: 导出镜像
        env: { ROOT: "${{ github.workspace }}", ARCH: "${{ inputs.arch }}" }
        run: |
          set -eu
          IMG="$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' IMAGE):${{ inputs.tier }}"
          docker image inspect "$IMG" >/dev/null || { echo "::error::构建声称成功但镜像 $IMG 不存在"; exit 1; }
          # 传出去的 tag 必须带架构后缀。发布阶段要把同一档位的各架构制品装进同一个
          # 守护进程，若它们共用 repo:tag，docker load 会把 tag 从先装的那个身上摘走
          # （日志里只留一句 renaming the old one ... to empty string），于是三个架构
          # 最终都指向最后装载的那一个，被推成三个架构 tag。这不是假设：v11 的三个档位
          # 就是这么发出去的，六次 push 引用同一层 93bc1ea4038b，只有 arch label 不同。
          ARCHIMG="$IMG-$ARCH"
          docker tag "$IMG" "$ARCHIMG"
          mkdir -p ship
          docker save "$ARCHIMG" | zstd -3 -T0 -o ship/image.tar.zst
          echo "$ARCHIMG" > ship/image-ref.txt
          ls -la ship/

      - uses: actions/upload-artifact@v4
        with:
          name: img-${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}
          path: ship/
          retention-days: 1
          compression-level: 0

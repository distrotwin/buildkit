name: 阶段二 · 构建单个镜像

# 一个 job 只建一个（版本 × 架构 × 档位），两条构建路径一视同仁。收益：
#   · mmdebstrap 路径三档完全独立，并行后墙钟从 45 分钟降到最慢那一档的 29 分钟
#   · 失败被隔离——devel 挂掉不再连带丢掉已经建好的 micro 与 base
# 产物用 docker save 走 artifact 传给测试阶段，不推临时 tag 污染 GHCR。
on:
  workflow_call:
    inputs:
      distro-id: { type: string, required: true }
      arch:      { type: string, required: true }
      tier:      { type: string, required: true }
      runner:    { type: string, required: true }
      needs-qemu: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: 核对 submodule 与 workflow 同版本
        run: |
          set -eu
          have=$(git -C buildkit rev-parse HEAD)
          want=$(grep -rhoE 'buildkit/\.github/workflows/[a-z-]+\.yml@[0-9a-f]{40}' .github/workflows/ \
                 | grep -oE '[0-9a-f]{40}$' | sort -u)
          n=$(printf '%s\n' "$want" | grep -c . || true)
          [ -n "$have" ] || { echo "::error::取不到 submodule 的 commit"; exit 1; }
          [ "$n" = "1" ] || { echo "::error::uses: 指向了 $n 个不同的 buildkit commit"; printf '%s\n' "$want"; exit 1; }
          [ "$have" = "$want" ] || { echo "::error::submodule($have) 与 workflow($want) 不是同一个 commit"; exit 1; }

      - name: 环境准备
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            mmdebstrap debootstrap dpkg-dev gpgv xz-utils zstd file
          if [ "${{ inputs.needs-qemu }}" = true ]; then
            sudo apt-get install -y -qq --no-install-recommends qemu-user-static binfmt-support
            ls /proc/sys/fs/binfmt_misc/ | head -20
          fi
          docker build -q --build-arg http_proxy= --build-arg https_proxy= \
            -f buildkit/Dockerfile.builder -t dosbuild-cache:latest buildkit/
          docker run -d --name dosb --privileged --init -v "$ROOT:/w" \
            -e DEBIAN_FRONTEND=noninteractive -e http_proxy= -e https_proxy= \
            dosbuild-cache:latest sleep infinity
          docker exec dosb bash -c 'ls -d /w/distros /w/buildkit/lib'

      - name: 造本地源（仅需要的版本）
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          RD=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' REPACK_DEBS)
          SP=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' STUB_PROVIDES)
          if [ -n "$RD" ] || [ -n "$SP" ]; then
            sudo -E buildkit/tools/mk-localrepo.sh '${{ inputs.distro-id }}'
          else
            echo "${{ inputs.distro-id }} 无 REPACK_DEBS / STUB_PROVIDES，跳过本地源"
          fi

      - name: 构建 ${{ inputs.tier }}
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          M=$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' METHOD)
          echo "METHOD=$M  TIER=${{ inputs.tier }}"

          # 一次尝试。执行位置按 METHOD 分派：
          #   mmdebstrap 系必须在 builder 容器（Debian 13）里跑——宿主 Ubuntu 22.04 的
          #   apt 与 mmdebstrap 差了好几代，signed-by 行为不同。
          #   selfhost 在宿主跑，它自己 docker exec 进容器完成阶段 1。
          # 每个档位各自跑一遍 debootstrap（实测约 4 分钟），不跨 job 共用 stage：
          # 三档本来并行，共用省的是 CPU 不是墙钟。
          attempt() {
            if [ "$M" = selfhost ]; then
              sudo -E DID='${{ inputs.distro-id }}' \
                buildkit/build/build-selfhost.sh '${{ inputs.tier }}'
            else
              docker exec -e http_proxy= -e https_proxy= dosb bash -c \
                "umask 022; ROOT=/w BK=/w/buildkit ARCH=$ARCH /w/buildkit/build/build.sh '${{ inputs.distro-id }}' '${{ inputs.tier }}'" \
              && sudo -E buildkit/build/import.sh '${{ inputs.distro-id }}' '${{ inputs.tier }}'
            fi
          }

          # 重试放在这里而不是脚本内部，是为了两条路径一视同仁。
          # build.sh 里那层档位级重试只包住 mmdebstrap 分支，而 selfhost 在本 workflow
          # 里是直接调 build-selfhost.sh、压根不经过 build.sh，于是它一直没有重试。
          # debootstrap 也不认 apt 的 Acquire::Retries，只能从外面兜。
          # 源对境外出口偶发卡死，实测形态包括「返回 200、Content-Length 正确、body 零字节」
          # 和 debootstrap 的 "E: Couldn't download packages: libc-bin"。
          ok=no
          for try in 1 2 3; do
            if attempt; then ok=yes; break; fi
            echo "::warning::第 $try 次构建未成，30 秒后重试"
            sleep 30
          done
          [ "$ok" = yes ] || { echo "::error::三次尝试均失败"; exit 1; }

      - name: 导出镜像
        env: { ROOT: "${{ github.workspace }}", ARCH: "${{ inputs.arch }}" }
        run: |
          set -eu
          IMG="$(buildkit/tools/conf-get.sh '${{ inputs.distro-id }}' IMAGE):${{ inputs.tier }}"
          docker image inspect "$IMG" >/dev/null || { echo "::error::构建声称成功但镜像 $IMG 不存在"; exit 1; }
          mkdir -p ship
          docker save "$IMG" | zstd -3 -T0 -o ship/image.tar.zst
          echo "$IMG" > ship/image-ref.txt
          ls -la ship/

      - uses: actions/upload-artifact@v4
        with:
          name: img-${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}
          path: ship/
          retention-days: 1
          compression-level: 0

name: 合并跨架构 manifest

# 各架构 job 推的是带 -<arch> 后缀的单架构 tag。本 workflow 把它们并成一个
# manifest list，让 `docker pull <image>:v11-devel` 按宿主架构自动选。
#
# 需要知道的一点：manifest list 的隐含契约是「各架构变体互为等价物，只是指令集不同」。
# 国产系统的 LoongArch 移植常常是独立产品线，glibc 可能落后一个大版本，
# 此时同一个 tag 在不同架构下的 ABI 并不一致。这不是错误，但必须在镜像仓库的
# 说明里如实写出来，否则用户会按 amd64 上验过的结论去用 loong 的镜像。
on:
  workflow_call:
    inputs:
      image:      { type: string, required: true }
      tag-prefix: { type: string, required: true }
      arches:     { type: string, required: true, description: "空格分隔，如 'amd64 arm64 loong64'" }
      tiers:      { type: string, default: "micro base devel" }
      latest-tier: { type: string, default: "", description: "非空时把该档同时打成 latest" }

permissions:
  contents: read
  packages: write

jobs:
  manifest:
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 manifest list
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          PFX: ${{ inputs.tag-prefix }}
        run: |
          set -eu
          for tier in ${{ inputs.tiers }}; do
            SRCS=""
            for a in ${{ inputs.arches }}; do
              # 缺哪个架构就跳过哪个，不让整个合并失败——某些版本本来就没有全部架构
              if docker manifest inspect "$REG:$PFX-$tier-$a" >/dev/null 2>&1; then
                SRCS="$SRCS $REG:$PFX-$tier-$a"
              else
                echo "跳过 $PFX-$tier-$a：该 tag 不存在"
              fi
            done
            [ -n "$SRCS" ] || { echo "$tier 一个架构都没有，跳过"; continue; }
            echo "合并 $PFX-$tier ←$SRCS"
            docker manifest create "$REG:$PFX-$tier" $SRCS
            docker manifest push  "$REG:$PFX-$tier"

            # 不带档位后缀的 tag 指向 devel：与 golang:1.21 是完整版、
            # golang:1.21-alpine 是精简版的惯例一致
            if [ "$tier" = devel ]; then
              docker manifest create "$REG:$PFX" $SRCS
              docker manifest push  "$REG:$PFX"
            fi
          done

      - name: 更新 latest
        if: inputs.latest-tier != ''
        env:
          REG: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
        run: |
          set -eu
          SRCS=""
          for a in ${{ inputs.arches }}; do
            T="$REG:${{ inputs.tag-prefix }}-${{ inputs.latest-tier }}-$a"
            docker manifest inspect "$T" >/dev/null 2>&1 && SRCS="$SRCS $T"
          done
          [ -n "$SRCS" ] || { echo "无可用架构，不动 latest"; exit 0; }
          docker manifest create "$REG:latest" $SRCS
          docker manifest push  "$REG:latest"

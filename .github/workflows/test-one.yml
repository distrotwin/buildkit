name: 阶段三 · 启动并全面测试单个镜像

# 与构建分离的独立阶段：把上游产出的镜像装载进来、真正启动它、跑完整检查集，
# 输出机器可读结果供汇总阶段合并成报告。
#
# 分离的意义不只是并行：构建阶段的机器状态（builder 容器、本地源、宿主装的包）
# 会掩盖镜像自身的缺陷——例如镜像里缺 CA 证书，但宿主有，某些检查就可能借到。
# 这里是一台干净机器，只有被测镜像。
on:
  workflow_call:
    inputs:
      distro-id: { type: string, required: true }
      arch:      { type: string, required: true }
      tier:      { type: string, required: true }
      runner:    { type: string, required: true }
      needs-qemu: { type: boolean, default: false, description: "非原生架构置 true。测试阶段同样要 docker run 被测镜像，binfmt 这个前提两个阶段各需要一次" }

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: 记录测试环境
        run: |
          echo "── 本 job 的输入 ──"
          echo "  distro-id=${{ inputs.distro-id }}  arch=${{ inputs.arch }}  tier=${{ inputs.tier }}"
          echo "  runner=${{ inputs.runner }}  needs-qemu=${{ inputs.needs-qemu }}"
          echo "── 宿主 ──"
          echo "  uname=$(uname -m)  发行版=$(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "  docker=$(docker --version)"
          df -h / | tail -1 | sed 's/^/  磁盘 /'

      - uses: actions/download-artifact@v4
        with:
          name: img-${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}
          path: ship

      # 构建阶段装过 QEMU 不等于测试阶段也有——两个阶段是两台机器。
      # 缺了的表现是冒烟步骤报「镜像起不来」，而那句话对「架构不能执行」和
      # 「镜像本身坏了」不加区分，容易被当成镜像的问题。
      - name: 安装 QEMU 用户态模拟
        if: inputs.needs-qemu
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support xz-utils binutils file
          echo "qemu-user-static: $(dpkg-query -W -f='${Version}' qemu-user-static)"
          case "${{ inputs.arch }}" in
            loong64|loongarch64) NEED=qemu-loongarch64 ;;
            arm64)               NEED=qemu-aarch64 ;;
            armhf)               NEED=qemu-arm ;;
            mips64el)            NEED=qemu-mips64el ;;
            *)                   NEED="" ;;
          esac
          if [ -n "$NEED" ] && [ ! -e "/proc/sys/fs/binfmt_misc/$NEED" ]; then
            echo "::error::binfmt 缺少 $NEED，无法运行 ${{ inputs.arch }} 镜像。"
            echo "::error::LoongArch 需要 QEMU 7.1 以上，Ubuntu 22.04 只带 6.2，请改用更新的 runner。"
            exit 1
          fi

          # 旧世界 LoongArch 要求 QEMU ≥ 9（发行版自带的 8.2.2 会报 Unknown syscall 80），
          # 而 Ubuntu 24.04 没有够新的包。这一步按目标架构决定要不要换版，换的是钉住
          # 校验和的那一个 static-pie 二进制，并在换完后核对注册项真的指向它。
          buildkit/tools/ensure-qemu.sh "${{ inputs.arch }}"

      - name: 装载镜像
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
          zstd -d -c ship/image.tar.zst | docker load
          IMG=$(cat ship/image-ref.txt)
          docker image inspect "$IMG" >/dev/null || { echo "::error::装载后镜像 $IMG 不存在"; exit 1; }
          echo "已装载 $IMG（$(docker images "$IMG" --format '{{.Size}}')）  架构 $(docker image inspect "$IMG" --format '{{.Architecture}}')"
          # verify.sh 按 conf 里的 IMAGE:TIER 找镜像，而制品的 tag 带架构后缀，
          # 这里补一个不带后缀的别名给它。测试 job 一次只装一个架构，别名不会撞车。
          PLAIN="${IMG%-${{ inputs.arch }}}"
          [ "$PLAIN" != "$IMG" ] || { echo "::error::制品 tag $IMG 没有 -${{ inputs.arch }} 后缀，与构建阶段的约定不一致"; exit 1; }
          docker tag "$IMG" "$PLAIN"

      - name: 冒烟：能不能真正启动
        run: |
          set -eu
          IMG=$(cat ship/image-ref.txt)
          # 只用 shell 内建，不依赖镜像里有没有 coreutils：
          # rootfs 里没有某个命令时，容器会沿 PATH 找不到而报错，
          # 那是「镜像缺工具」而不是「起不来」，两者要分开。
          out=$(docker run --rm "$IMG" /bin/bash -c 'echo SMOKE_OK; echo $MACHTYPE' 2>&1) || {
            echo "::error::镜像起不来: $out"; exit 1; }
          printf '%s\n' "$out" | sed 's/^/  /'
          mkdir -p logs
          {
            echo "=== 镜像 $IMG ==="
            docker image inspect "$IMG" --format '大小 {{.Size}} 字节  架构 {{.Architecture}}  创建 {{.Created}}' || true
            echo "=== 冒烟输出 ==="; printf '%s\n' "$out"
          } > "logs/${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}.smoke.log"
          printf '%s' "$out" | grep -q SMOKE_OK || { echo "::error::启动了但没有预期输出"; exit 1; }

      - name: 编门禁二进制
        env: { ARCH: "${{ inputs.arch }}" }
        run: sudo -E ARCH="$ARCH" buildkit/gate/build-gates.sh

      - name: 全面检查
        env: { ARCH: "${{ inputs.arch }}", ROOT: "${{ github.workspace }}" }
        run: |
          set -eu
          ID='${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}'
          mkdir -p "$ROOT/logs"
          # 成功的日志同样留下。只留失败的那份，等于「出问题时才有线索」——
          # 而判断一个失败是不是回归，往往需要跟上一次成功的输出逐行比。
          # set -o pipefail 是必须的：不加的话退出码取自 tee，检查失败会被吞掉。
          set -o pipefail
          sudo -E ARCH="$ARCH" \
            DISTROS='${{ inputs.distro-id }}' TIERS='${{ inputs.tier }}' \
            RESULT_JSON="$ROOT/results/$ID.json" \
            buildkit/test/verify.sh '${{ inputs.distro-id }}' 2>&1 | tee "$ROOT/logs/$ID.verify.log"

      # 失败也要把结果交上去，否则报告里这一格是空白，分不清「没跑」和「跑挂了」
      # 结果与日志一起交。失败也要交，否则报告里这一格是空白，
      # 分不清「没跑」和「跑挂了」。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ inputs.distro-id }}-${{ inputs.arch }}-${{ inputs.tier }}
          path: |
            results/
            logs/
          retention-days: 7
          if-no-files-found: warn
